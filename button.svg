<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" role="img" aria-label="stelle.codes">
  <defs>
    <pattern id="grid" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="translate(-3 -5)">
      <path d="M11 0H0V11" fill="none" stroke="#a58dca" stroke-opacity="0.10" stroke-width="1" shape-rendering="crispEdges"/>
    </pattern>
  </defs>

  <!-- background + faint grid -->
  <rect width="88" height="31" fill="#0c0c0f"/>
  <rect width="88" height="31" fill="url(#grid)"/>

  <!-- hairline frame -->
  <rect x="2.5" y="2.5" width="83" height="26" fill="none" stroke="#5f5286" stroke-width="0.5"/>

  <!-- corner brackets (text color, like the site frame) -->
  <g fill="none" stroke="#ededf0" stroke-width="0.5">
    <path d="M2.5 6.5 L2.5 2.5 L6.5 2.5"/>
    <path d="M81.5 2.5 L85.5 2.5 L85.5 6.5"/>
    <path d="M2.5 24.5 L2.5 28.5 L6.5 28.5"/>
    <path d="M81.5 28.5 L85.5 28.5 L85.5 24.5"/>
  </g>

  <!-- wordmark -->
  <text x="44" y="16" text-anchor="middle" dominant-baseline="central"
        font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace"
        font-size="9.5" font-weight="600" letter-spacing="0.2">
    <tspan fill="#ededf0">stelle</tspan><tspan fill="#a58dca">.</tspan><tspan fill="#ededf0">codes</tspan>
  </text>
</svg>
